version: '3.8'

services:
  # ── Cache / Queues ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Primary Database (MongoDB) ───────────────────────────────────────────────
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-bombio}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-bombiopass}
      MONGO_INITDB_DATABASE: bombio
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Services ─────────────────────────────────────────────────────────────────
  login-server:
    build: ./services/login-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-prod}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://${MONGO_USER:-bombio}:${MONGO_PASSWORD:-bombiopass}@mongodb:27017/bombio?authSource=admin
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  match-server:
    build: ./services/match-server
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOGIN_SERVER_URL=http://login-server:8000
      - BATTLE_SERVER_HOST=localhost
      - UDP_PORT_START=5000
    depends_on:
      redis:
        condition: service_healthy
      login-server:
        condition: service_started
    restart: unless-stopped

  battle-server:
    build: ./services/battle-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://${MONGO_USER:-bombio}:${MONGO_PASSWORD:-bombiopass}@mongodb:27017/bombio?authSource=admin
      - BATTLE_SERVER_HOST=localhost
      - UDP_PORT_START=5000
      - UDP_PORT_END=5000
      - MATCH_SERVER_URL=http://match-server:8001
      - MAX_PLAYERS_PER_ROOM=50
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      match-server:
        condition: service_started
    deploy:
      replicas: 3
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  rank-server:
    build: ./services/rank-server
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://${MONGO_USER:-bombio}:${MONGO_PASSWORD:-bombiopass}@mongodb:27017/bombio?authSource=admin
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  mongo-data:
