<!doctype html>
    <html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-assistant-RAG</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div>
          <h1>AI-assistant-RAG</h1>
          <p id="statusText">Checking vector data base...</p>
        </div>
        <div class="hint-list">
          <button class="hint" data-question="AI-assistant-RAGWhat is?">AI-assistant-RAGcolumn?</button>
          <button class="hint" data-question="How to add a new document?">How to add documents</button>
          <button class="hint" data-question="Please tell me an exercise plan for beginners.">beginner workout plan</button>
          <button class="hint" data-question="What Should a Healthy Meal Include??">healthy eating basics</button>
        </div>
      </aside>

      <section class="chat-panel" aria-label="RAG chat">
        <div id="messages" class="messages">
          <article class="message assistant">
            <div class="bubble">
              Please enter your question. Finds indexed documents and provides a simple answer, along with supporting documents..
            </div>
          </article>
        </div>

        <form id="chatForm" class="composer">
          <input
            id="questionInput"
            type="text"
            autocomplete="off"
            placeholder="Ask a question about the document..."
            aria-label="Question"
          />
          <button type="submit">question</button>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
