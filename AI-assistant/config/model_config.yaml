# =============================================================================
# Joseon Dynasty artificial intelligence assistant — config file
# =============================================================================
# This file contains the model structure, ticket analyzer, material, learning, about reasoning
# Contains all parameters.
# Be sure to re-run preprocessing and training after changes..
# =============================================================================


# -----------------------------------------------------------------------------
# Model structure settings (model)
# -----------------------------------------------------------------------------
# GPT one-way converter(Transformer) It's a structure.
# More parameters provide more expressive power, but also increase learning time and memory usage..
model:

  # converter block(floor) number
  # - 6~8:  miniature model (30M parameter, Data 1GB less than)
  # - 12:   medium model (85M parameter, Data 10~100GB)
  # - 24:   large model (350M parameter, material 100GB more than, RTX 5070You can learn with)
  n_layer: 8

  # attention head(Attention Head) number
  # - surely n_embdmust be a factor of (yes: n_embd=512If 1,2,4,8,16 possible)
  # - The more heads there are, the more diverse positional relationships can be learned simultaneously.
  # - recommended: n_embdto n_headSet to be 64 or more when divided by
  #   (yes: n_embd=512, n_head=8 → 64 dimensions per head)
  n_head: 8

  # Hidden vector dimension (Hidden Dimension)
  # - These are the key parameters that determine model capacity.
  # - 256:  very small (For experimental use)
  # - 512:  small default (30M parameter)
  # - 768:  medium size (85M parameter, GPT-2 Small level)
  # - 1024: large (350M parameter, GPT-2 Medium level)
  n_embd: 512

  # Forward Neural Network Internal Dimensions (FFN Inner Dimension)
  # - generally n_embd × 4Set it to
  # - n_embd=512 → ffn_dim=2048
  # - n_embd=768 → ffn_dim=3072
  ffn_dim: 2048

  # maximum context length (number of tickets)
  # - Maximum number of tickets the model can process at once
  # - Make sure your study material document is longer than the average length
  # - 512:  Suitable for short text-oriented materials
  # - 1024: default (Suitable for most cases)
  # - 2048: long text material (need more memory)
  # - caution: data block_sizeIf it is less than that, it will automatically decrease.
  block_size: 1024

  # vocabulary size (Vocabulary Size)
  # - After pretreatment meta.jsonIt is automatically overwritten with the value of
  # - This value is also used in word mark analyzer training.
  # - 2048~4096:  small data (Auto-adjusted)
  # - 8192:       Mesoscale data (hundredsMB)
  # - 16384:      large scale data (numberGB more than) ← recommended
  # - 32768:      Super-scale data (dozensGB more than)
  vocab_size: 16384

  # dropout rate (Dropout Rate)
  # - Prevent overfitting by randomly disabling some neurons during training
  # - 0.0:   No dropout (When there is a lot of data)
  # - 0.1:   default (recommended)
  # - 0.2:   Enhanced prevention of overfitting when data is small
  dropout: 0.1

  # Whether to use a bias term (Bias on Linear Layers)
  # - false: Save memory and calculations, The standard for modern large models
  # - true:  May have a slight advantage in small models
  bias: false

  # Input/output projective weight sharing (Weight Tying)
  # - true: Insert Input(Embedding)Share the weights of the output linear layer with
  #   → number of parameters vocab_size × n_embdreduce by (about 8M savings)
  # - false: Use separate weights (need more memory)
  tie_weights: true


# -----------------------------------------------------------------------------
# Mark analyzer settings (tokenizer)
# -----------------------------------------------------------------------------
# SentencePiece BPE(Two-letter pair encoding) method is used.
# Once you train a wordmark analyzer, you can reuse it throughout the entire model training period..
# If you change the tag analyzer later, it will not be compatible with the existing model..
tokenizer:

  # Vocabulary Analyzer Vocabulary Size
  # - model.vocab_sizeSet it the same as
  # - If there is less data, it will be automatically reduced.
  vocab_size: 16384

  # SentencePiece model method
  # - bpe:    Two-letter pair encoding (Best suited for Korean language, recommended)
  # - unigram: single model (Better compression ratio in some cases)
  # - char:   character unit (Very small vocabulary size, Combination is slow)
  # - word:   word unit (Weak processing of unknown words)
  model_type: bpe

  # Letter inclusion ratio (Character Coverage)
  # - some of the total letters %Decide whether to include it in your vocabulary
  # - 0.9995: Recommended values for Korean language (Hangul has a large number of characters, so set it high.)
  # - 0.9999: Includes all rare letters
  # - 1.0:    Includes all letters (Increase vocabulary size)
  character_coverage: 0.9995

  # Tag analyzer model storage path (checkpoints/ Base relative path)
  # result: checkpoints/tokenizer/dprk_sp.model
  #        checkpoints/tokenizer/dprk_sp.vocab
  output_prefix: tokenizer/dprk_sp


# -----------------------------------------------------------------------------
# Material settings (data)
# -----------------------------------------------------------------------------
data:

  # Source material folder path (Based on project root)
  # Supported Format: .txt .json .jsonl .pdf .docx .jpg .png .jpeg .bmp .gif .webp .tiff
  # Automatically navigates to subfolders
  raw_dir: data/raw

  # Preprocessed binary data storage folder
  # content: train.bin, val.bin, meta.json
  processed_dir: data/processed

  # learning/Verification Separation Ratio
  # - 0.95: 95 of total documents%For learning, 5%used for verification
  # - 0 if there is little data.90Decrease to secure more verification data
  # - 0 if the data is more than 1 million documents.99You can increase it to
  train_split: 0.95


# -----------------------------------------------------------------------------
# Learning Settings (train)
# -----------------------------------------------------------------------------
# AdamW optimizer + Uses cosine learning rate decay.
train:

  # Intermediate save point and TensorBoard log storage folder
  out_dir: checkpoints

  # Cow bundle size (Micro Batch Size)
  # - Graphics Processing Unit Number of documents to be processed in one forward calculation
  # - RTX 5070 12GBFrom 30M model basis: Up to 32 possible
  # - 85M If it's a model, it's 8~16reduce to (Prevent memory overload)
  # - 256M If it's a model, reduce it to 4
  batch_size: 16

  # Gradient cumulative steps (Gradient Accumulation Steps)
  # - Effective bundle size = batch_size × grad_accum_steps × block_size
  # - present: 16 × 4 × 1024 = 65,536 tag/Optimization step
  # - batch_sizeIf you reduce , increase this value to maintain the effective bundle size.
  #   (yes: batch_size=8, grad_accum_steps=8 → same effective size)
  grad_accum_steps: 4

  # maximum learning rate (Peak Learning Rate)
  # - AdamWis the upper bound on the learning rate of
  # - 3.0e-4: miniature model(30M) default
  # - 1.0e-4: medium model(85M) recommended
  # - 6.0e-5: large model(350M) recommended
  # - fine tuning(Fine-tuning) poetry: 1 of the original value/10 (yes: 3.0e-5)
  learning_rate: 3.0e-4

  # Minimum learning rate (Minimum Learning Rate)
  # - This is the lower bound for cosine damping. (Usually 10 of the maximum learning rate%)
  # - At the end of training, it converges to this value
  min_lr: 3.0e-5

  # number of warmth levels (Warmup Steps)
  # - At the beginning of training, we linearly increase the learning rate from 0 to the maximum.
  # - Prevents instability due to sudden large tilts
  # - 1 of total steps~2% Please set it to about
  # - max_steps=5000If it is 100, max_steps=200000If it's 2000
  warmup_steps: 100

  # Total number of learning steps (Total Training Steps)
  # - 1 step = grad_accum_stepsProcessing of bundles of cattle + 1Parameter update
  # - Recommended values depending on data size:
  #   1MB  less than: 1,000~5,000
  #   10MB:      5,000~20,000
  #   1GB:       50,000~100,000
  #   10GB:      100,000~300,000
  #   100GB:     500,000~1,000,000
  # - If learning loss no longer decreases, you can stop
  max_steps: 5000

  # weight attenuation (Weight Decay)
  # - To prevent overfitting L2 is the normalization coefficient
  # - 0.1: standard value (GPT-3, nanoGPT default)
  weight_decay: 0.1

  # AdamW 1difference moment coefficient (Beta1)
  # - is the exponential moving average coefficient of the slope
  # - 0.9: standard value
  beta1: 0.9

  # AdamW 2difference moment coefficient (Beta2)
  # - is the exponential moving average coefficient of the slope squared
  # - 0.95: GPT Series standard value (general Adamof 0.999lower than)
  beta2: 0.95

  # slope cutoff value (Gradient Clipping)
  # - If the magnitude of the gradient exceeds this value, it is reduced proportionally.
  # - explosive tilt(Exploding Gradient) prevent
  # - 1.0: standard value (Almost no need to change)
  grad_clip: 1.0

  # Verification and intermediate storage cycle (step unit)
  # - For each step, we calculate the verification loss and store the intermediate save points.
  # - 250: default (~2Save every minute, RTX 5070 standard)
  # - 100When learning Giga data, you can increase it to 1000.
  eval_interval: 250

  # Number of cows to use in calculating verification loss
  # - The more the more accurate, but it takes time
  # - 50: default (stable enough)
  eval_iters: 50

  # Learning loss recording cycle (step unit)
  # - This is the cycle of outputting loss values to the console.
  # - 10: default
  log_interval: 10

  # Generation example output cycle (step unit)
  # - For each of these steps, we output example sentences that the model actually generates.
  # - Use to visually check learning progress
  # - 500: default
  sample_interval: 500

  # Number of recent intermediate savepoints to keep
  # - Saves storage space by automatically deleting previous intermediate save points.
  # - _best, _final Tagged items are always preserved
  # - 3: Last 3 saved (disk saving + safety balance)
  # - We recommend at least 3 for recovery after force quit
  ckpt_keep_last: 3

  # Operational precision (dtype)
  # - bfloat16: RTX 3090/4090/5070(Blackwell) recommended, Stable and fast
  # - float16:  Previous GPU(V100 etc.), bfloat16 Automatically selected if not supported
  # - float32:  Safest but 2~3It's slower and uses twice as much memory.
  dtype: bfloat16

  # torch.compile Used or not
  # - true:  about 10~20% speed up (First run takes minutes)
  # - false: default (Highly reproducible, Convenient debugging)
  # - PyTorch 2.0+ and CUDA need, WindowsThere are some restrictions in
  compile: false


# -----------------------------------------------------------------------------
# Setting inference defaults (inference)
# -----------------------------------------------------------------------------
# This is the default value used when generating sentences with the learned model..
# Real-time adjustment is possible with the slider on the Gradio screen..
inference:

  # Maximum number of tickets to generate (Max New Tokens)
  # - Maximum number of tokens to generate in one conversation response
  # - tag ≈ Hangul 1~2letters or parts of English words
  # - 128: short answer (quick response)
  # - 256: medium length (default)
  # - 512: long answer (more detailed explanation)
  default_max_new_tokens: 256

  # temperature (Temperature)
  # - Controls the randomness of the next note selection
  # - 0.1~0.5: Consistent and predictable output (Good for factual information answers)
  # - 0.7~1.0: balanced output (Default 0.9)
  # - 1.0~1.5: Creative and diverse output (creation, Perfect for creating poetry)
  default_temperature: 0.9

  # top K sampling (Top-k Sampling)
  # - High probability top KChoose only from the list of quotes
  # - The lower the consistency↑, The higher the diversity↑
  # - 10~20: Very focused output
  # - 50:    default (balance)
  # - 100+:  Very versatile output
  default_top_k: 50

  # Nuclear sampling probability (Top-p / Nucleus Sampling)
  # - cumulative probability PAdd tags until you reach and select from them.
  # - top_kWhen used with , both conditions apply
  # - 0.85: focused output
  # - 0.95: default
  # - 1.0:  Consider all quotes (top_p Same as disable)
  default_top_p: 0.95

  # repetition suppression coefficient (Repetition Penalty)
  # - The probability that an already created tag will be selected again is divided by this value.
  # - 1.0:  no inhibitions (Allow repetition)
  # - 1.1~1.2: weak inhibition (recommended)
  # - 1.3~1.5: strong inhibition (sweet, Too high increases grammatical errors)
  default_repetition_penalty: 1.15
