<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowEndTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D6B"/>
    </marker>
    <marker id="arrowEndOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E89B3D"/>
    </marker>

    <!-- Soft drop shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="#F8FAFC"/>

  <!-- =========================================================== -->
  <!--                      HEADER                                  -->
  <!-- =========================================================== -->
  <text x="700" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#0F172A">
    Smart Home IoT App — How It Works
  </text>
  <text x="700" y="90" text-anchor="middle" font-size="16" fill="#64748B">
    A simple overview of how the user, mobile app, our cloud, and smart devices work together
  </text>

  <!-- =========================================================== -->
  <!--               TOP FLOW LABEL (commands)                      -->
  <!-- =========================================================== -->
  <text x="700" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D6B" letter-spacing="1.5">
    ▸  COMMANDS  ▸
  </text>

  <!-- =========================================================== -->
  <!--           FORWARD ARROWS (top, left → right)                 -->
  <!-- =========================================================== -->
  <!-- User → App -->
  <line x1="280" y1="180" x2="380" y2="180" stroke="#2E7D6B" stroke-width="2.5" marker-end="url(#arrowEndTeal)"/>
  <text x="330" y="172" text-anchor="middle" font-size="11" fill="#475569">tap / type</text>

  <!-- App → Backend -->
  <line x1="640" y1="180" x2="740" y2="180" stroke="#2E7D6B" stroke-width="2.5" marker-end="url(#arrowEndTeal)"/>
  <text x="690" y="172" text-anchor="middle" font-size="11" fill="#475569">secure request</text>

  <!-- Backend → Devices -->
  <line x1="1000" y1="180" x2="1100" y2="180" stroke="#2E7D6B" stroke-width="2.5" marker-end="url(#arrowEndTeal)"/>
  <text x="1050" y="172" text-anchor="middle" font-size="11" fill="#475569">control signal</text>

  <!-- =========================================================== -->
  <!--                      ACTOR CARDS                             -->
  <!-- =========================================================== -->

  <!-- ===== USER CARD ===== -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="200" width="200" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Top accent band -->
    <path d="M 80 216 A 16 16 0 0 1 96 200 L 264 200 A 16 16 0 0 1 280 216 L 280 240 L 80 240 Z" fill="#6B5B95"/>
    <text x="180" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      THE PERSON
    </text>

    <!-- User icon: head + shoulders -->
    <g transform="translate(180, 310)">
      <circle cx="0" cy="-20" r="26" fill="#EFE9F7" stroke="#6B5B95" stroke-width="2.5"/>
      <path d="M -40 30 Q -40 -5 0 -5 Q 40 -5 40 30 Z" fill="#EFE9F7" stroke="#6B5B95" stroke-width="2.5"/>
    </g>

    <!-- Label -->
    <text x="180" y="395" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">User</text>
    <text x="180" y="425" text-anchor="middle" font-size="13" fill="#64748B">Homeowner using</text>
    <text x="180" y="443" text-anchor="middle" font-size="13" fill="#64748B">the app on their phone</text>
  </g>

  <!-- ===== MOBILE APP CARD ===== -->
  <g filter="url(#cardShadow)">
    <rect x="380" y="200" width="260" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 380 216 A 16 16 0 0 1 396 200 L 624 200 A 16 16 0 0 1 640 216 L 640 240 L 380 240 Z" fill="#2E7D6B"/>
    <text x="510" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      MOBILE APP
    </text>

    <!-- Phone icon -->
    <g transform="translate(510, 340)">
      <rect x="-42" y="-70" width="84" height="140" rx="10" fill="#D4EFE7" stroke="#2E7D6B" stroke-width="2.5"/>
      <rect x="-34" y="-58" width="68" height="108" rx="3" fill="#FFFFFF" stroke="#2E7D6B" stroke-width="1.5"/>
      <!-- Screen dots representing UI elements -->
      <rect x="-26" y="-48" width="52" height="10" rx="2" fill="#2E7D6B" opacity="0.25"/>
      <rect x="-26" y="-32" width="22" height="22" rx="3" fill="#2E7D6B" opacity="0.5"/>
      <rect x="4" y="-32" width="22" height="22" rx="3" fill="#E89B3D" opacity="0.6"/>
      <rect x="-26" y="-4" width="22" height="22" rx="3" fill="#1E5F8C" opacity="0.5"/>
      <rect x="4" y="-4" width="22" height="22" rx="3" fill="#2E7D6B" opacity="0.5"/>
      <rect x="-26" y="24" width="52" height="6" rx="1.5" fill="#2E7D6B" opacity="0.25"/>
      <!-- Home button / indicator -->
      <circle cx="0" cy="60" r="4" fill="#2E7D6B" opacity="0.4"/>
    </g>

    <text x="510" y="430" text-anchor="middle" font-size="13" fill="#64748B">Shows homes, rooms, devices.</text>
    <text x="510" y="448" text-anchor="middle" font-size="13" fill="#64748B">Sends commands when you tap.</text>
  </g>

  <!-- ===== CLOUD BACKEND CARD ===== -->
  <g filter="url(#cardShadow)">
    <rect x="740" y="200" width="260" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 740 216 A 16 16 0 0 1 756 200 L 984 200 A 16 16 0 0 1 1000 216 L 1000 240 L 740 240 Z" fill="#1E5F8C"/>
    <text x="870" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      CLOUD BACKEND
    </text>

    <!-- Cloud icon -->
    <g transform="translate(870, 330)">
      <!-- Cloud shape -->
      <path d="M -50 10
               C -70 10 -70 -20 -50 -20
               C -50 -45 -20 -50 -10 -35
               C 0 -55 35 -55 40 -30
               C 65 -30 65 10 40 10
               Z" fill="#E3F1FB" stroke="#1E5F8C" stroke-width="2.5"/>
      <!-- Server stack inside -->
      <rect x="-22" y="-15" width="44" height="6" rx="1" fill="#1E5F8C" opacity="0.7"/>
      <rect x="-22" y="-5" width="44" height="6" rx="1" fill="#1E5F8C" opacity="0.7"/>
      <circle cx="-15" cy="-12" r="1.5" fill="#FFFFFF"/>
      <circle cx="-15" cy="-2" r="1.5" fill="#FFFFFF"/>
    </g>

    <text x="870" y="395" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">Our Server</text>
    <text x="870" y="425" text-anchor="middle" font-size="13" fill="#64748B">Verifies the user, stores data,</text>
    <text x="870" y="443" text-anchor="middle" font-size="13" fill="#64748B">forwards messages to devices.</text>
  </g>

  <!-- ===== SMART DEVICES CARD ===== -->
  <g filter="url(#cardShadow)">
    <rect x="1100" y="200" width="220" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 1100 216 A 16 16 0 0 1 1116 200 L 1304 200 A 16 16 0 0 1 1320 216 L 1320 240 L 1100 240 Z" fill="#E89B3D"/>
    <text x="1210" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
      SMART DEVICES
    </text>

    <!-- Bulb -->
    <g transform="translate(1160, 320)">
      <circle cx="0" cy="0" r="20" fill="#FFF4D6" stroke="#E89B3D" stroke-width="2.5"/>
      <rect x="-7" y="18" width="14" height="6" fill="#E89B3D"/>
      <rect x="-5" y="24" width="10" height="4" fill="#94734A"/>
      <!-- glow lines -->
      <line x1="-30" y1="0" x2="-24" y2="0" stroke="#E89B3D" stroke-width="2"/>
      <line x1="24" y1="0" x2="30" y2="0" stroke="#E89B3D" stroke-width="2"/>
      <line x1="-22" y1="-22" x2="-18" y2="-18" stroke="#E89B3D" stroke-width="2"/>
      <line x1="18" y1="-22" x2="22" y2="-18" stroke="#E89B3D" stroke-width="2"/>
    </g>

    <!-- Thermostat -->
    <g transform="translate(1230, 320)">
      <rect x="-18" y="-18" width="36" height="36" rx="6" fill="#FCF1E3" stroke="#E89B3D" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" stroke="#E89B3D" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-7" stroke="#E89B3D" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Camera -->
    <g transform="translate(1185, 380)">
      <rect x="-22" y="-12" width="44" height="24" rx="4" fill="#FCF1E3" stroke="#E89B3D" stroke-width="2.5"/>
      <circle cx="-2" cy="0" r="7" fill="#FFFFFF" stroke="#E89B3D" stroke-width="2"/>
      <circle cx="-2" cy="0" r="3" fill="#E89B3D"/>
      <circle cx="15" cy="-6" r="1.5" fill="#E89B3D"/>
    </g>

    <text x="1210" y="437" text-anchor="middle" font-size="13" fill="#64748B">Lights, thermostats,</text>
    <text x="1210" y="455" text-anchor="middle" font-size="13" fill="#64748B">cameras, sensors, etc.</text>
  </g>

  <!-- =========================================================== -->
  <!--          REVERSE ARROWS (bottom, right → left)               -->
  <!-- =========================================================== -->
  <!-- Devices → Backend -->
  <line x1="1100" y1="510" x2="1000" y2="510" stroke="#E89B3D" stroke-width="2.5" marker-end="url(#arrowEndOrange)"/>
  <text x="1050" y="528" text-anchor="middle" font-size="11" fill="#475569">status report</text>

  <!-- Backend → App -->
  <line x1="740" y1="510" x2="640" y2="510" stroke="#E89B3D" stroke-width="2.5" marker-end="url(#arrowEndOrange)"/>
  <text x="690" y="528" text-anchor="middle" font-size="11" fill="#475569">live push</text>

  <!-- App → User -->
  <line x1="380" y1="510" x2="280" y2="510" stroke="#E89B3D" stroke-width="2.5" marker-end="url(#arrowEndOrange)"/>
  <text x="330" y="528" text-anchor="middle" font-size="11" fill="#475569">UI updates</text>

  <!-- Bottom flow label -->
  <text x="700" y="558" text-anchor="middle" font-size="13" font-weight="600" fill="#E89B3D" letter-spacing="1.5">
    ◂  LIVE UPDATES  ◂
  </text>

  <!-- =========================================================== -->
  <!--                  USER JOURNEY (numbered)                     -->
  <!-- =========================================================== -->
  <text x="700" y="615" text-anchor="middle" font-size="20" font-weight="700" fill="#0F172A">
    What a typical session looks like
  </text>

  <!-- Step 1 -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="650" width="300" height="190" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="100" cy="690" r="22" fill="#2E7D6B"/>
    <text x="100" y="697" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
    <text x="140" y="685" font-size="16" font-weight="700" fill="#0F172A">Sign in</text>
    <text x="140" y="703" font-size="13" fill="#64748B">Open the app, log in.</text>
    <text x="80" y="745" font-size="13" fill="#475569">• Email &amp; password sent</text>
    <text x="80" y="765" font-size="13" fill="#475569">  to our cloud</text>
    <text x="80" y="790" font-size="13" fill="#475569">• Cloud verifies and</text>
    <text x="80" y="810" font-size="13" fill="#475569">  remembers the session</text>
  </g>

  <!-- Step 2 -->
  <g filter="url(#cardShadow)">
    <rect x="390" y="650" width="300" height="190" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="430" cy="690" r="22" fill="#2E7D6B"/>
    <text x="430" y="697" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
    <text x="470" y="685" font-size="16" font-weight="700" fill="#0F172A">Browse the home</text>
    <text x="470" y="703" font-size="13" fill="#64748B">See homes, rooms, devices.</text>
    <text x="410" y="745" font-size="13" fill="#475569">• App asks the cloud</text>
    <text x="410" y="765" font-size="13" fill="#475569">  for the user's data</text>
    <text x="410" y="790" font-size="13" fill="#475569">• List of devices and</text>
    <text x="410" y="810" font-size="13" fill="#475569">  their status shown</text>
  </g>

  <!-- Step 3 -->
  <g filter="url(#cardShadow)">
    <rect x="720" y="650" width="300" height="190" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="760" cy="690" r="22" fill="#2E7D6B"/>
    <text x="760" y="697" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
    <text x="800" y="685" font-size="16" font-weight="700" fill="#0F172A">Tap to control</text>
    <text x="800" y="703" font-size="13" fill="#64748B">Turn things on/off, set values.</text>
    <text x="740" y="745" font-size="13" fill="#475569">• Command goes through</text>
    <text x="740" y="765" font-size="13" fill="#475569">  the cloud to the device</text>
    <text x="740" y="790" font-size="13" fill="#475569">• Device acts within</text>
    <text x="740" y="810" font-size="13" fill="#475569">  a second or two</text>
  </g>

  <!-- Step 4 -->
  <g filter="url(#cardShadow)">
    <rect x="1050" y="650" width="300" height="190" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="1090" cy="690" r="22" fill="#E89B3D"/>
    <text x="1090" y="697" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
    <text x="1130" y="685" font-size="16" font-weight="700" fill="#0F172A">See live updates</text>
    <text x="1130" y="703" font-size="13" fill="#64748B">No refresh needed.</text>
    <text x="1070" y="745" font-size="13" fill="#475569">• Devices report status</text>
    <text x="1070" y="765" font-size="13" fill="#475569">  back to the cloud</text>
    <text x="1070" y="790" font-size="13" fill="#475569">• Cloud pushes updates</text>
    <text x="1070" y="810" font-size="13" fill="#475569">  straight to the app</text>
  </g>

  <!-- =========================================================== -->
  <!--                       FOOTER                                 -->
  <!-- =========================================================== -->
  <text x="700" y="880" text-anchor="middle" font-size="11" fill="#94A3B8">
    Smartify · Smart Home IoT Platform — high-level workflow
  </text>
</svg>
