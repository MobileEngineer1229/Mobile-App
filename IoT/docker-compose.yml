version: '3.8'

services:
  emqx:
    image: emqx/emqx:5.3.0
    container_name: smarthome-emqx
    ports:
      - "1883:1883"     # MQTT TCP
      - "8083:8083"     # MQTT WebSocket
      - "8084:8084"     # MQTT WebSocket (SSL)
      - "18083:18083"   # EMQX Dashboard
    environment:
      - EMQX_NAME=smarthome
      - EMQX_HOST=0.0.0.0
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  emqx_data:
  emqx_log:
